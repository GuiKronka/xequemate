<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>XequeMate — Xadrez entre amigos</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>
  <header class="top"><h1>♟ XequeMate</h1><div id="connection" class="pill">Desconectado</div></header>

  <section id="setup" class="setup">
    <div class="card">
      <h2>Jogue com seu amigo</h2>
      <p class="msg">Crie uma sala ou entre com o código enviado pelo adversário.</p>
      <label for="nickname">Seu apelido</label>
      <input id="nickname" maxlength="18" placeholder="Ex.: Kronka">
      <label for="timeControl">Tempo por jogador</label>
            <select id="timeControl">
        <option value="60+0">1 minuto</option>
        <option value="180+0">3 minutos</option>
        <option value="180+2">3 min + 2 s por lance</option>
        <option value="300+0">5 minutos</option>
        <option value="300+3">5 min + 3 s por lance</option>
        <option value="600+0" selected>10 minutos</option>
        <option value="600+5">10 min + 5 s por lance</option>
        <option value="900+10">15 min + 10 s por lance</option>
        <option value="1200+0">20 minutos</option>
        <option value="1800+0">30 minutos</option>
        <option value="2700+0">45 minutos</option>
        <option value="3600+0">60 minutos</option>
      </select>
      <div class="row"><button id="createBtn" class="primary" style="flex:1">Criar sala</button></div>
      <div class="row"><input id="roomCode" maxlength="6" placeholder="Código da sala"><button id="joinBtn">Entrar</button></div>
      <p id="setupMessage" class="msg"></p>
        <p class="msg">A partida fica salva por 1h40 sem atividade. Para voltar, abra o site e entre com o mesmo código e o mesmo apelido.</p>
    </div>
  </section>

  <main id="game" class="game hidden">
    <section class="stage">
     <div class="bar" id="plTop"><div class="who"><b id="nameTop"></b><div id="capTop" class="cap"></div></div><span id="clockTop" class="clock">10:00</span></div>
      <div class="wrap"><div id="board" class="board" aria-label="Tabuleiro de xadrez"></div><div id="banner" class="banner" role="status"></div></div>
      <div class="bar" id="plBot"><div class="who"><b id="nameBot"></b><div id="capBot" class="cap"></div></div><span id="clockBot" class="clock">10:00</span></div>
      <div id="gameStatus" class="status"></div>
    </section>
    <aside>
      <div class="info">Sala <strong id="roomLabel">------</strong> · <span id="orientation"></span></div>
      <div id="moveList" class="log"></div>
      <div class="btns">
        <button id="copyCode">Copiar convite</button>
        <button id="pgnBtn">Copiar PGN</button>
        <button id="flipBtn">Girar tabuleiro</button>
        <button id="drawBtn">Oferecer empate</button>
        <button id="declineBtn" class="hidden">Recusar empate</button>
        <button id="resignBtn">Desistir</button>
        <button id="rematchBtn" disabled>Revanche</button>
        <button id="leaveBtn">Sair da sala</button>
                <button id="muteBtn">🔊 Som</button>
      </div>
      <p id="rematchInfo" class="msg"></p>
      <p id="gameMessage" class="msg"></p>
    </aside>
  </main>

  <div id="promo" class="ov" hidden><div class="card"><b>Promover peão para:</b><div id="pbtns" class="btns"></div></div></div>
  <script src="app.js"></script>
    <script src="torneio.js"></script>
</body>
</html>
